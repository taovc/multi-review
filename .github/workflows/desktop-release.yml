name: desktop-release

# Three triggers, cross-platform packaging of the Electron desktop app (matrix linux/mac/win → electron-builder):
#   1. push to main    → build and overwrite the rolling `nightly` pre-release (stable download URL, no login, zero maintenance, for fast iteration).
#   2. manual dispatch → build and upload artifacts only (platform optional), touching no Release.
#   3. push desktop-v* → collect all artifacts into one proper draft GitHub Release.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        required: false
        default: "all"
        options:
          - all
          - linux
          - mac
          - win
  push:
    branches:
      - main
    tags:
      - "desktop-v*"

# Cancel an older build of the same ref when a new push supersedes it (fast iteration on main never queues; different tags/refs don't affect each other).
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; only the Release-publishing jobs need write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix: ${{ fromJson((github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all') && '{"include":[{"os":"ubuntu-latest","platform":"linux"},{"os":"macos-latest","platform":"mac"},{"os":"windows-latest","platform":"win"}]}' || github.event.inputs.platform == 'linux' && '{"include":[{"os":"ubuntu-latest","platform":"linux"}]}' || github.event.inputs.platform == 'mac' && '{"include":[{"os":"macos-latest","platform":"mac"}]}' || '{"include":[{"os":"windows-latest","platform":"win"}]}') }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package desktop
        shell: bash
        env:
          # No Apple Developer certificate → no mac code signing (skip certificate auto-discovery)
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          # nuxt build (node-server output) + swap the better-sqlite3 binary for the Electron ABI
          pnpm electron:build
          pnpm exec electron-builder --${{ matrix.platform }} --publish=never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          # Upload only distributable files, no intermediate build output
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn
          # Manual builds kept 1 day; tag builds kept 30 days (those artifacts are already in the GitHub Release, this is just a backup copy).
          # Note: in GitHub Actions expressions 0 is falsy, so `'tag' && 0 || 1` is always 1 — use non-zero values.
          retention-days: ${{ github.ref_type == 'tag' && 30 || 1 }}

  # On a desktop-v* tag push, collect the three platforms' artifacts into one GitHub Release.
  # Only runs on tag pushes: a manual workflow_dispatch may build a single platform even when a tag ref is selected,
  # which would publish a Release missing platforms — hence the extra event_name == 'push' condition.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist-artifacts/**/*

  # On a push to main, overwrite the rolling `nightly` pre-release with the three platforms' artifacts.
  # Update in place (rather than delete-then-recreate): when the release already exists it is never deleted; the nightly tag is
  #   force-moved to this commit and same-name assets are overwritten with --clobber; only the first run creates it. This removes
  #   the long window in which the whole release disappears under delete-then-recreate.
  # Asset names: a space-free artifactName keeps the local name == the server-side name (see package.json build.artifactName),
  #   and the nightly version barely changes → filenames are constant on every run, so --clobber overwrites 1:1 and leaves no stale assets.
  # Stable download URL: github.com/<repo>/releases/tag/nightly (direct download, no login, on public repos).
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Publish rolling nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # merge-multiple flattens the artifacts into dist-artifacts/; collect with find (not shell globs, so any nesting works).
          mapfile -t assets < <(find dist-artifacts -type f)
          if [ "${#assets[@]}" -eq 0 ]; then echo "没有找到任何构建产物" >&2; exit 1; fi

          # F1: nightly is an unattended automatic release, so all three platforms must be present, otherwise it silently
          #   publishes a pre-release with platforms missing.
          # Assert on each platform's signature installer: mac=.dmg, win=.exe, linux=.AppImage; any one missing fails the whole job.
          for pattern in "*.dmg" "*.exe" "*.AppImage"; do
            if [ -z "$(find dist-artifacts -type f -name "$pattern" -print -quit)" ]; then
              echo "::error::缺少必需的平台安装包($pattern);nightly 需要 mac/windows/linux 三平台齐全,已中止发布" >&2
              exit 1
            fi
          done

          title="Nightly (main)"
          notes="Rolling build from the latest \`main\` (${GITHUB_SHA:0:7}). Overwritten on every merge — not a versioned release. macOS/Windows builds are unsigned; you may need to bypass Gatekeeper/SmartScreen on first launch."

          # F2: delete-then-recreate briefly 404s the whole stable download URL (especially when cancel-in-progress fires between
          #   the delete and the create, or create fails on network/consistency lag, leaving release and tag deleted but not recreated).
          #   Updating in place removes that long window: an existing release is never deleted, only its assets and metadata are
          #   overwritten; only the first run creates it (create with retries).
          #   Note: this is still not strictly atomic — --clobber deletes then uploads each same-name asset, so if cancel-in-progress
          #   happens to cancel this job between one asset's delete and re-upload, that single asset is briefly missing (gh drops its
          #   old copy too); but at most one file is affected and the next push re-uploads it — the whole release no longer disappears.
          #   True atomicity would need temp-name-plus-swap or turning off cancel-in-progress for this job alone; on balance we accept
          #   this tiny single-asset window.
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "nightly 已存在:就地覆盖资产与元数据(不删除整份 release,大空窗已消除;单个资产仍有极小重传窗口)"
            # Atomically force-move the nightly tag to this commit (force update, no delete, no gap); on failure only warn, don't block the release.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true \
              || echo "::warning::移动 nightly tag 到 ${GITHUB_SHA:0:7} 失败,release 资产仍会照常更新"
            # Refresh title/notes/prerelease flag.
            gh release edit nightly --repo "$GITHUB_REPOSITORY" --prerelease --title "$title" --notes "$notes"
            # Overwrite same-name assets. artifactName is now a space-free template (package.json build.artifactName), so the local
            #   filename matches the GitHub server-side asset name and --clobber reliably matches and replaces the old asset. The
            #   nightly version barely changes → filenames are constant on every run, --clobber overwrites 1:1 and leaves no stale
            #   assets, so we no longer run a separate "delete old assets by name" cleanup — that step was redundant and, because the
            #   local name (with spaces) can never equal the server name (spaces turned into dots), it would delete every installer
            #   that had just been uploaded.
            gh release upload nightly --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            echo "nightly 尚不存在:创建预发布(create 加重试,抵御网络/一致性抖动)"
            for attempt in 1 2 3; do
              if gh release create nightly \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --prerelease \
                --title "$title" \
                --notes "$notes" \
                "${assets[@]}"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::创建 nightly 预发布失败(已重试 3 次),固定下载地址可能缺失,请人工介入" >&2
                exit 1
              fi
              echo "创建失败(第 ${attempt}/3 次),10 秒后重试..." >&2
              sleep 10
            done
          fi
